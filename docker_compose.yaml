services:
  chernuha_space:
    image: chernuha/test-1:latest
    restart: always
    container_name: apps
    ports:
          - "8000:8000"
    healthcheck:
      test: curl --fail http://localhost:8000 || exit 1
      interval: 60s
      retries: 3
      start_period: 20s
      timeout: 10s

      logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M